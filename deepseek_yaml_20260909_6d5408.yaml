version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./thumbnails:/app/thumbnails
    depends_on:
      - redis
    restart: unless-stopped
    command: node server-advanced.js

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./thumbnails:/app/thumbnails
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    command: python worker-advanced.py
    deploy:
      replicas: 3  # Run 3 workers for parallel processing

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data: